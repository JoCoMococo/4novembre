
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un espai secret</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --purple: #a994c9;
    --pink: #d5a9c4;
    --text: #655b76;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            circle at var(--x, 50%) var(--y, 50%),
            rgba(255,255,255,0.38),
            transparent 38%
        ),
        linear-gradient(
            135deg,
            #e8ddf5,
            #dce9f5,
            #f4e0eb,
            #f5eddf
        );
}

/* Fons amb moviment subtil */

.orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(3px);
    opacity: 0.35;
    pointer-events: none;
    animation: float 12s ease-in-out infinite;
}

.orb.one {
    width: 220px;
    height: 220px;
    background: #c9b6e8;
    top: 5%;
    left: 8%;
}

.orb.two {
    width: 260px;
    height: 260px;
    background: #e9c5d8;
    bottom: 0;
    right: 5%;
    animation-delay: -5s;
}

.orb.three {
    width: 130px;
    height: 130px;
    background: #c4dced;
    bottom: 15%;
    left: 17%;
    animation-delay: -8s;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-22px); }
}

/* Partícules */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    opacity: 0.55;
    animation: drift 10s linear infinite;
}

@keyframes drift {
    from {
        transform: translateY(20px);
        opacity: 0;
    }
    20% { opacity: 0.55; }
    80% { opacity: 0.35; }
    to {
        transform: translateY(-100px);
        opacity: 0;
    }
}

/* Targeta */

.container {
    position: relative;
    z-index: 2;
    width: min(90%, 430px);
    padding: 58px 42px;
    text-align: center;

    background: rgba(255,255,255,0.48);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 25px;

    box-shadow:
        0 25px 65px rgba(111,92,145,0.15),
        inset 0 1px 2px rgba(255,255,255,0.8);

    transform-style: preserve-3d;
    transition: transform 0.25s ease,
                box-shadow 0.3s ease;

    animation: appear 1s ease both;
}

.container:hover {
    box-shadow:
        0 32px 75px rgba(111,92,145,0.2),
        inset 0 1px 2px white;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
    }
}

h1 {
    font-family: Georgia, serif;
    font-size: 36px;
    font-weight: 400;
    color: #716384;
    margin: 5px 0 14px;
}

.description {
    font-size: 14px;
    line-height: 1.8;
    color: #8e849d;
}

/* Entrada */

input {
    width: 100%;
    margin-top: 27px;
    padding: 16px;

    border-radius: 13px;
    border: 1px solid rgba(160,145,185,0.25);
    background: rgba(255,255,255,0.65);

    color: #625773;
    font-size: 15px;
    text-align: center;
    outline: none;

    transition: all 0.3s ease;
}

input::placeholder {
    color: #aaa1b7;
}

input:focus {
    border-color: #b9a5dc;
    box-shadow: 0 0 0 4px rgba(185,165,220,0.15);
    background: rgba(255,255,255,0.9);
}

/* Botó */

button {
    width: 100%;
    margin-top: 17px;
    padding: 16px;

    border: none;
    border-radius: 13px;

    background: linear-gradient(135deg, #bba6dc, #d4b2d7);
    color: white;

    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;

    cursor: pointer;
    box-shadow: 0 7px 18px rgba(153,126,190,0.2);

    transition: transform 0.25s ease,
                box-shadow 0.25s ease;
}

button:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 13px 25px rgba(153,126,190,0.3);
}

button:active {
    transform: translateY(-1px);
}

/* Flor i comptador */

.code-counter {
    position: fixed;
    z-index: 3;
    top: 28px;
    right: 30px;

    display: flex;
    align-items: center;
    gap: 11px;

    padding: 11px 15px;
    border-radius: 17px;

    background: rgba(255,255,255,0.42);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 8px 25px rgba(111,92,145,0.08);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    transition: transform 0.3s ease;
}

.code-counter:hover {
    transform: translateY(-3px);
}

.flower {
    width: 34px;
    height: 43px;
    overflow: visible;
}

.counter-number {
    font-family: Georgia, serif;
    font-size: 23px;
    color: #8d79ac;
    line-height: 1;
}

.counter-label {
    font-size: 9px;
    letter-spacing: 1px;
    color: #93899f;
    text-transform: uppercase;
    margin-top: 4px;
}

/* Mòbil */

@media (max-width: 520px) {
    .container {
        padding: 45px 26px;
    }

    h1 {
        font-size: 30px;
    }

    .code-counter {
        top: 16px;
        right: 16px;
        padding: 8px 11px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>

<div class="particles" id="particles"></div>

<!-- Comptador de codis -->

<div class="code-counter">

    <svg class="flower" viewBox="0 0 40 50"
         fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- Tija -->
        <path d="M20 13 C20 25 19 34 20 45"
              stroke="#9b91b5"
              stroke-width="1.6"
              stroke-linecap="round"/>

        <!-- Fulla -->
        <path d="M20 33 C10 26 7 34 20 37"
              stroke="#a5a0b8"
              stroke-width="1.4"
              stroke-linecap="round"/>

        <!-- Cap sense pètals -->
        <circle cx="20" cy="10" r="4.5"
                fill="#d6b9d8"
                stroke="#aa91c3"
                stroke-width="1.3"/>

    </svg>

    <div>
        <div class="counter-number" id="counter">0</div>
        <div class="counter-label">Codis disponibles</div>
    </div>

</div>

<!-- Pantalla principal -->

<main class="container" id="card">

    <h1>El teu espai</h1>

    <p class="description">
        Hi ha coses que només s'obren<br>
        amb la clau adequada.
    </p>

    <input
        type="text"
        placeholder="Escriu el teu codi..."
        autocomplete="off"
        id="code"
    >

    <button type="button">
        ACCEDIR
    </button>

</main>

<script>

// Moviment de la llum del fons

document.addEventListener("mousemove", (e) => {
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;

    document.body.style.setProperty("--x", x + "%");
    document.body.style.setProperty("--y", y + "%");
});

// Gravetat subtil de la targeta

const card = document.getElementById("card");

document.addEventListener("mousemove", (e) => {
    if (window.innerWidth < 700) return;

    const x = (e.clientX / window.innerWidth - 0.5) * 5;
    const y = (e.clientY / window.innerHeight - 0.5) * -5;

    card.style.transform =
        `perspective(1000px) rotateY(${x}deg) rotateX(${y}deg)`;
});

document.addEventListener("mouseleave", () => {
    card.style.transform =
        "perspective(1000px) rotateY(0deg) rotateX(0deg)";
});

// Petites partícules decoratives

const particleArea = document.getElementById("particles");

for (let i = 0; i < 22; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.top = Math.random() * 100 + "%";
    p.style.animationDuration = (7 + Math.random() * 9) + "s";
    p.style.animationDelay = (-Math.random() * 12) + "s";
    particleArea.appendChild(p);
}

</script>

</body>
</html>
