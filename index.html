<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Portal</title>

<style>
body {
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    text-align: center;
    width: 85%;
    max-width: 400px;
}

h1 {
    font-size: 30px;
    letter-spacing: 5px;
    font-weight: 300;
}

p {
    color: #888;
    font-size: 12px;
    letter-spacing: 2px;
}

input {
    background: transparent;
    border: 1px solid #555;
    color: white;
    padding: 15px;
    width: 85%;
    margin-top: 25px;
    text-align: center;
    outline: none;
}

button {
    background: white;
    color: black;
    border: none;
    padding: 13px 30px;
    margin-top: 20px;
    cursor: pointer;
    letter-spacing: 2px;
}
</style>
</head>

<body>
<div class="container">
    <h1>SECRET PORTAL</h1>
    <p>ENTER YOUR ACCESS CODE</p>

    <input type="text" placeholder="Enter code">

    <br>
    <button>ACCESS</button>
</div>
</body>
</html>
