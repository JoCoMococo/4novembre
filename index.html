
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La seva web</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --purple: #a994c9;
    --pink: #d5a9c4;
    --text: #655b76;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;
    color: var(--text);

    background:
        radial-gradient(circle at var(--x, 50%) var(--y, 50%),
        rgba(255,255,255,0.20), transparent 38%),
        linear-gradient(135deg,
        #ddd3eb, #d3dfeb, #ead5e0, #e9e1d3);
}

/* FONS */

.orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(5px);
    opacity: 0.24;
    pointer-events: none;
    animation: float 12s ease-in-out infinite;
}

.orb.one {
    width: 220px;
    height: 220px;
    background: #b9a6d7;
    top: 5%;
    left: 8%;
}

.orb.two {
    width: 260px;
    height: 260px;
    background: #d9afc5;
    bottom: 0;
    right: 5%;
    animation-delay: -5s;
}

.orb.three {
    width: 130px;
    height: 130px;
    background: #b5ccdf;
    bottom: 15%;
    left: 17%;
    animation-delay: -8s;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-22px);
    }
}

/* PARTÍCULES */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    opacity: 0.4;
    animation: drift 10s linear infinite;
}

@keyframes drift {
    from {
        transform: translateY(20px);
        opacity: 0;
    }
    20% {
        opacity: 0.4;
    }
    80% {
        opacity: 0.3;
    }
    to {
        transform: translateY(-100px);
        opacity: 0;
    }
}

/* TARGETA PRINCIPAL */

.container {
    position: relative;
    z-index: 2;
    width: min(90%, 430px);
    padding: 58px 42px;
    text-align: center;

    background: rgba(255,255,255,0.48);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 25px;

    box-shadow:
        0 25px 65px rgba(111,92,145,0.14),
        inset 0 1px 2px rgba(255,255,255,0.8);

    transform-style: preserve-3d;
    transition: box-shadow 0.3s ease;
    animation: appear 1s ease both;
}

.container:hover {
    box-shadow:
        0 32px 75px rgba(111,92,145,0.19);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
    }
}

h1 {
    font-family: Georgia, serif;
    font-size: 36px;
    font-weight: 400;
    color: #716384;
    margin: 5px 0 14px;
}

.description {
    font-size: 14px;
    line-height: 1.8;
    color: #8e849d;
}

/* ENTRADA DEL CODI */

input {
    width: 100%;
    margin-top: 27px;
    padding: 16px;
    border-radius: 13px;
    border: 1px solid rgba(160,145,185,0.25);
    background: rgba(255,255,255,0.65);
    color: #625773;
    font-size: 15px;
    text-align: center;
    outline: none;
    transition: all 0.3s ease;
}

input::placeholder {
    color: #aaa1b7;
}

input:focus {
    border-color: #b9a5dc;
    box-shadow: 0 0 0 4px rgba(185,165,220,0.15);
    background: rgba(255,255,255,0.9);
}

/* BOTÓ */

button {
    width: 100%;
    margin-top: 17px;
    padding: 16px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #aa96c9, #c49fc5);
    color: white;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(153,126,190,0.18);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

button:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 13px 25px rgba(153,126,190,0.25);
}

button:active {
    transform: translateY(-1px);
}

/* COMPTADOR DE CODIS */

.code-counter {
    position: fixed;
    z-index: 4;
    top: 25px;
    right: 30px;

    display: flex;
    align-items: center;
    gap: 11px;

    padding: 11px 15px;
    border-radius: 17px;

    background: rgba(255,255,255,0.42);
    border: 1px solid rgba(255,255,255,0.7);

    box-shadow: 0 8px 25px rgba(111,92,145,0.08);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    transition: transform 0.3s ease;
}

.code-counter:hover {
    transform: translateY(-3px);
}

.counter-flower {
    width: 34px;
    height: 43px;
    flex-shrink: 0;
}

.counter-number {
    font-family: Georgia, serif;
    font-size: 23px;
    color: #8d79ac;
    line-height: 1;
}

.counter-label {
    font-size: 9px;
    letter-spacing: 1px;
    color: #93899f;
    text-transform: uppercase;
    margin-top: 4px;
}

/* FLOR GRAN DE L'ESQUERRA */

.flower-plant {
    position: fixed;
    z-index: 1;
    left: 3%;
    bottom: 0;
    height: 57vh;
    width: 145px;
    overflow: visible;
    pointer-events: none;
    opacity: 0.9;

    transform-origin: 50% 100%;
    animation: breeze 5s ease-in-out infinite;
}

/* MOVIMENT DEL VENT */

@keyframes breeze {
    0%, 100% {
        transform: rotate(0deg);
    }

    25% {
        transform: rotate(1.8deg);
    }

    50% {
        transform: rotate(0deg);
    }

    75% {
        transform: rotate(-1.8deg);
    }
}

.flower-plant svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* TIJA */

.stem {
    fill: none;
    stroke: #879b91;
    stroke-width: 3;
    stroke-linecap: round;
}

/* FULLES */

.leaf {
    fill: #a5b6a8;
    stroke: #82988a;
    stroke-width: 1.3;
}

/* CENTRE DE LA FLOR */

.flower-center {
    fill: #d9bb87;
    stroke: #b69b78;
    stroke-width: 1.5;
}

/* PÈTALS */

.petal {
    fill: #d5a9d2;
    stroke: #aa91bd;
    stroke-width: 1.5;
    transform-box: view-box;
    transform-origin: 70px 105px;
    animation: grow 1s ease both;
}

@keyframes grow {
    from {
        opacity: 0;
        transform: scale(0.1);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* ADAPTACIÓ A MÒBILS */

@media (max-width: 700px) {
    .flower-plant {
        left: -28px;
        height: 36vh;
        width: 100px;
        opacity: 0.65;
    }

    .container {
        padding: 45px 26px;
    }

    h1 {
        font-size: 30px;
    }

    .code-counter {
        top: 16px;
        right: 16px;
        padding: 8px 11px;
    }
}

/* ACCESSIBILITAT */

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<!-- FONS -->

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>

<div class="particles" id="particles"></div>

<!-- COMPTADOR -->

<div class="code-counter">

    <svg class="counter-flower" viewBox="0 0 40 50"
         fill="none" xmlns="http://www.w3.org/2000/svg">

        <path d="M20 13 C20 25 19 34 20 45"
              stroke="#9b91b5"
              stroke-width="1.6"
              stroke-linecap="round"/>

        <path d="M20 33 C10 26 7 34 20 37"
              stroke="#a5a0b8"
              stroke-width="1.4"
              stroke-linecap="round"/>

        <circle cx="20" cy="10" r="4.5"
                fill="#d6b9d8"
                stroke="#aa91c3"
                stroke-width="1.3"/>
    </svg>

    <div>
        <div class="counter-number" id="counter">0</div>
        <div class="counter-label">Codis disponibles</div>
    </div>

</div>

<!-- FLOR GRAN DE L'ESQUERRA -->

<div class="flower-plant">

    <svg viewBox="0 0 140 600"
         preserveAspectRatio="xMidYMax meet">

        <!-- TIJA -->
        <path class="stem"
              d="M70 105
                 C57 210 82 285 68 375
                 C60 450 76 510 70 600"/>

        <!-- FULLA INFERIOR -->
        <path class="leaf"
              d="M68 440
                 C30 410 13 429 68 452
                 C47 433 40 424 68 440Z"/>

        <!-- FULLA SUPERIOR -->
        <path class="leaf"
              d="M70 300
                 C105 270 127 282 70 315
                 C91 290 105 283 70 300Z"/>

        <!-- CENTRE -->
        <circle class="flower-center"
                cx="70" cy="105" r="10"/>

        <!-- PÈTALS DINÀMICS -->
        <g id="petals"></g>

    </svg>

</div>

<!-- TARGETA PRINCIPAL -->

<main class="container" id="card">

    <h1>La seva web</h1>

    <p class="description">
        Necessites els codis per canviar<br>
         i passar a la següent web.
    </p>

    <input
        type="text"
        id="code"
        placeholder="Escriu el teu codi..."
        autocomplete="off"
    >

    <button type="button">
        ACCEDIR
    </button>

</main>

<script>

// MOVIMENT DE LA LLUM DEL FONS

document.addEventListener("mousemove", (e) => {

    const x = e.clientX / window.innerWidth * 100;
    const y = e.clientY / window.innerHeight * 100;

    document.body.style.setProperty("--x", x + "%");
    document.body.style.setProperty("--y", y + "%");

});

// EFECTE 3D DE LA TARGETA

const card = document.getElementById("card");

document.addEventListener("mousemove", (e) => {

    if (window.innerWidth < 700) return;

    const x = (e.clientX / window.innerWidth - 0.5) * 4;
    const y = (e.clientY / window.innerHeight - 0.5) * -4;

    card.style.transform =
        `perspective(1000px) rotateY(${x}deg) rotateX(${y}deg)`;

});

document.addEventListener("mouseleave", () => {

    card.style.transform =
        "perspective(1000px) rotateY(0deg) rotateX(0deg)";

});

// PARTÍCULES DECORATIVES

const particleArea = document.getElementById("particles");

for (let i = 0; i < 22; i++) {

    const p = document.createElement("div");

    p.className = "particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.top = Math.random() * 100 + "%";
    p.style.animationDuration = (7 + Math.random() * 9) + "s";
    p.style.animationDelay = (-Math.random() * 12) + "s";

    particleArea.appendChild(p);

}

// FLOR QUE CREIX SEGONS ELS CODIS

function actualitzarFlor(nombreCodis) {

    const grup = document.getElementById("petals");
    const comptador = document.getElementById("counter");

    const nombre = Math.max(0, Math.floor(nombreCodis));

    comptador.textContent = nombre;
    grup.innerHTML = "";

    for (let i = 0; i < nombre; i++) {

        const angle = -90 + (360 / nombre) * i;

        const petal = document.createElementNS(
            "http://www.w3.org/2000/svg", "path"
        );

        petal.setAttribute(
            "d",
            "M70 96 C52 77 48 49 70 30 C92 49 88 77 70 96 Z"
        );

        petal.setAttribute(
            "transform",
            `rotate(${angle} 70 105)`
        );

        petal.setAttribute("class", "petal");
        petal.style.animationDelay = (i * 0.08) + "s";

        grup.appendChild(petal);

    }

}

// INICI: CAP CODI DISPONIBLE

actualitzarFlor(0);

</script>

</body>
</html>
