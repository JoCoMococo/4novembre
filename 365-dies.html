
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>365 dies</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 35px 15px;
    font-family: 'Segoe UI', sans-serif;
    color: #51465e;
    background: linear-gradient(
        120deg,
        #e9ddf4,
        #dceafa,
        #f6e1e9,
        #f8eddf,
        #e1e8f5
    );
    background-size: 400% 400%;
    animation: backgroundMove 20s ease infinite;
}

@keyframes backgroundMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* LLUMS DE FONS */

.ambient {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(65px);
    opacity: 0.55;
    animation: drift 18s ease-in-out infinite alternate;
}

.orb1 {
    width: 380px;
    height: 380px;
    background: #d8b9eb;
    top: -120px;
    left: -100px;
}

.orb2 {
    width: 430px;
    height: 430px;
    background: #b9d9ed;
    bottom: -160px;
    right: -100px;
    animation-delay: -7s;
}

.orb3 {
    width: 280px;
    height: 280px;
    background: #f2cbd9;
    top: 45%;
    left: 65%;
    animation-delay: -11s;
}

.orb4 {
    width: 250px;
    height: 250px;
    background: #f5dfbd;
    top: 60%;
    left: -100px;
    animation-delay: -4s;
}

@keyframes drift {
    0% {
        transform: translate(0, 0) scale(1);
    }
    50% {
        transform: translate(80px, -45px) scale(1.15);
    }
    100% {
        transform: translate(-35px, 55px) scale(0.9);
    }
}

/* PARTÍCULES */

.particles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.particle {
    position: absolute;
    bottom: -15px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 12px rgba(255,255,255,0.9);
    animation: rise linear infinite;
}

@keyframes rise {
    0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
    }
    15% { opacity: 0.7; }
    80% { opacity: 0.45; }
    100% {
        transform: translateY(-110vh) translateX(35px);
        opacity: 0;
    }
}

/* LLUM DEL CURSOR */

.cursor-light {
    position: fixed;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: rgba(255,255,255,0.27);
    filter: blur(75px);
    pointer-events: none;
    z-index: 1;
    transform: translate(-50%, -50%);
    left: 50%;
    top: 50%;
    transition: left 0.25s ease, top 0.25s ease;
}

/* TARGETA */

.container {
    position: relative;
    z-index: 2;
    width: min(100%, 760px);
    padding: clamp(35px, 7vw, 65px) clamp(18px, 5vw, 55px);
    text-align: center;
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 32px;
    background: rgba(255,255,255,0.43);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow:
        0 25px 80px rgba(100,80,120,0.13),
        inset 0 1px 1px rgba(255,255,255,0.8);
    animation: enter 1.4s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes enter {
    from {
        opacity: 0;
        transform: translateY(35px) scale(0.96);
        filter: blur(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

.subtitle {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #8c7c9b;
    margin-bottom: 20px;
    opacity: 0;
    animation: fade 1s ease 0.4s forwards;
}

h1 {
    font-size: clamp(55px, 13vw, 105px);
    font-weight: 300;
    letter-spacing: -3px;
    line-height: 1.08;
    color: #695879;
    margin: 0 auto 5px;
    max-width: 100%;
    overflow-wrap: anywhere;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    animation: fade 1s ease 0.6s forwards;
}

.main-label {
    font-size: 18px;
    color: #85758f;
    margin-bottom: 38px;
    opacity: 0;
    animation: fade 1s ease 0.8s forwards;
}

.divider {
    width: 65px;
    height: 1px;
    background: rgba(120,100,140,0.35);
    margin: 0 auto 30px;
    opacity: 0;
    animation: fade 1s ease 1s forwards;
}

.details {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    opacity: 0;
    animation: fade 1s ease 1.1s forwards;
}

.unit {
    min-width: 0;
    padding: 17px 5px;
    border-radius: 17px;
    background: rgba(255,255,255,0.38);
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow: 0 5px 20px rgba(100,80,120,0.035);
}

.number {
    display: inline-block;
    font-size: clamp(19px, 3.5vw, 30px);
    font-weight: 400;
    color: #6d5b7c;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

.number.changed {
    animation: numberChange 0.35s ease;
}

@keyframes numberChange {
    0% {
        opacity: 0.2;
        transform: translateY(-8px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

.label {
    display: block;
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #94869e;
}

.footer {
    margin-top: 35px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #9a8ba3;
    opacity: 0;
    animation: fade 1s ease 1.4s forwards;
}

@keyframes fade {
    to { opacity: 1; }
}

/* PANTALLES PETITES */

@media (max-width: 520px) {
    .container {
        padding: 38px 16px;
        border-radius: 25px;
    }

    h1 {
        font-size: clamp(48px, 16vw, 76px);
    }

    .details {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
    }

    .unit {
        padding: 13px 3px;
    }

    .number {
        font-size: clamp(20px, 6vw, 27px);
    }

    .label {
        font-size: 9px;
        letter-spacing: 0.7px;
    }

    .main-label {
        margin-bottom: 30px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<div class="ambient">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
</div>

<div class="particles" id="particles"></div>
<div class="cursor-light" id="cursorLight"></div>

<main class="container">

    <div class="subtitle">La novel·la s'ha estat escrivint durant:</div>

    <h1 id="totalDays">0</h1>
    <div class="main-label">dies junts</div>

    <div class="divider"></div>

    <div class="details">

        <div class="unit">
            <span class="number" id="months">0</span>
            <span class="label">Mesos</span>
        </div>

        <div class="unit">
            <span class="number" id="days">0</span>
            <span class="label">Dies</span>
        </div>

        <div class="unit">
            <span class="number" id="hours">00</span>
            <span class="label">Hores</span>
        </div>

        <div class="unit">
            <span class="number" id="minutes">00</span>
            <span class="label">Minuts</span>
        </div>

        <div class="unit">
            <span class="number" id="seconds">00</span>
            <span class="label">Segons</span>
        </div>

    </div>

    <div class="footer">
        I encara queden molts capítols
    </div>

</main>

<script>
// DATA EXACTA D'INICI
// 4 de novembre de 2025 a les 18:00, hora de Girona (CET).

const inici = new Date("2025-11-04T18:00:00+01:00");

const elements = {
    totalDays: document.getElementById("totalDays"),
    months: document.getElementById("months"),
    days: document.getElementById("days"),
    hours: document.getElementById("hours"),
    minutes: document.getElementById("minutes"),
    seconds: document.getElementById("seconds")
};

const valorsAnteriors = {};

function actualitzarNumero(element, valor, clau) {
    if (valorsAnteriors[clau] !== valor) {
        element.textContent = valor;
        element.classList.remove("changed");

        void element.offsetWidth;

        element.classList.add("changed");
        valorsAnteriors[clau] = valor;
    }
}

function calcularTemps() {
    const ara = new Date();
    const diferencia = Math.max(0, ara.getTime() - inici.getTime());

    const totalSegons = Math.floor(diferencia / 1000);
    const totalDies = Math.floor(totalSegons / 86400);

    const hores = Math.floor((totalSegons % 86400) / 3600);
    const minuts = Math.floor((totalSegons % 3600) / 60);
    const segons = totalSegons % 60;

    // Calcula mesos i dies de calendari.
    let mesos = 0;
    let cursor = new Date(inici.getTime());

    while (true) {
        const seguent = new Date(cursor.getTime());
        seguent.setMonth(seguent.getMonth() + 1);

        if (seguent.getTime() > ara.getTime()) {
            break;
        }

        cursor = seguent;
        mesos++;
    }

    const diesRestants = Math.floor(
        (ara.getTime() - cursor.getTime()) / 86400000
    );

    actualitzarNumero(elements.totalDays, totalDies, "totalDays");
    actualitzarNumero(elements.months, mesos, "months");
    actualitzarNumero(elements.days, diesRestants, "days");
    actualitzarNumero(elements.hours, String(hores).padStart(2, "0"), "hours");
    actualitzarNumero(elements.minutes, String(minuts).padStart(2, "0"), "minutes");
    actualitzarNumero(elements.seconds, String(segons).padStart(2, "0"), "seconds");
}

// Executa el càlcul immediatament i després cada segon.
calcularTemps();
setInterval(calcularTemps, 1000);

// CREA PARTÍCULES ALEATÒRIES.
const particles = document.getElementById("particles");

for (let i = 0; i < 32; i++) {
    const p = document.createElement("div");
    p.className = "particle";

    const mida = 2 + Math.random() * 4;
    p.style.width = mida + "px";
    p.style.height = mida + "px";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (10 + Math.random() * 18) + "s";
    p.style.animationDelay = (-Math.random() * 25) + "s";

    particles.appendChild(p);
}

// LLUM QUE SEGUEIX EL RATOLÍ.
const cursorLight = document.getElementById("cursorLight");

document.addEventListener("mousemove", (e) => {
    cursorLight.style.left = e.clientX + "px";
    cursorLight.style.top = e.clientY + "px";
});

// En mòbils, evita deixar la llum en una posició estranya.
document.addEventListener("touchstart", (e) => {
    if (e.touches.length > 0) {
        cursorLight.style.left = e.touches[0].clientX + "px";
        cursorLight.style.top = e.touches[0].clientY + "px";
    }
}, { passive: true });

</script>

</body>
</html>
